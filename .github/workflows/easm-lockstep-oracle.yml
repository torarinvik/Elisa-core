name: EASM Lockstep Oracle

on:
  pull_request:
    paths:
      - ".github/workflows/easm-lockstep-oracle.yml"
      - "compiler/src/easm/**"
      - "compiler/scripts/run_lockstep_oracle_gate.sh"
      - "docs/103-easm-barrier-three-levels.md"
      - "docs/104-easm-as-typed-assembly.md"
  push:
    branches:
      - main
      - work
    paths:
      - ".github/workflows/easm-lockstep-oracle.yml"
      - "compiler/src/easm/**"
      - "compiler/scripts/run_lockstep_oracle_gate.sh"
      - "docs/103-easm-barrier-three-levels.md"
      - "docs/104-easm-as-typed-assembly.md"
  workflow_dispatch:

jobs:
  oracle:
    name: Lockstep Execution Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: compiler/go.mod
          cache-dependency-path: compiler/go.sum

      - name: Install LLVM 19 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19
          # Ubuntu folds the C API into libLLVM.so, but the #cgo stanza links -lLLVM-C
          sudo ln -sf libLLVM.so /usr/lib/llvm-19/lib/libLLVM-C.so
          # the gate scripts exec unversioned clang / llvm-config / llvm-mc
          sudo ln -sf /usr/bin/clang-19       /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-19     /usr/local/bin/clang++
          sudo ln -sf /usr/bin/llvm-config-19 /usr/local/bin/llvm-config
          sudo ln -sf /usr/bin/llvm-mc-19     /usr/local/bin/llvm-mc

      - name: Show toolchain versions
        run: |
          go version
          clang --version
          llvm-mc --version || llvm-config --version

      - name: Run lockstep oracle gate
        working-directory: compiler
        run: ./scripts/run_lockstep_oracle_gate.sh
